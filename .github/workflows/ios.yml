name: iOS build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test on an iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build web vault for mobile
        run: |
          npm run build:crypto
          npm run build:mobile --workspace=@toasty/web

      - name: Copy web bundle into the iOS app
        run: |
          rm -rf apps/mobile/ios/App/App/public
          mkdir -p apps/mobile/ios/App/App/public
          cp -r apps/web/dist/. apps/mobile/ios/App/App/public/

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd apps/mobile/ios
          xcodegen generate

      - name: Build for testing
        run: |
          cd apps/mobile/ios
          UDID=$(xcrun simctl list devices available | grep "iPhone" | sed -n 's/.*(\([0-9A-F-]\{36\}\)).*/\1/p' | head -1)
          echo "Using simulator: $UDID"
          xcodebuild build-for-testing \
            -project Toasty.xcodeproj \
            -scheme Toasty \
            -destination "id=$UDID"

      - name: Run tests
        run: |
          cd apps/mobile/ios
          UDID=$(xcrun simctl list devices available | grep "iPhone" | sed -n 's/.*(\([0-9A-F-]\{36\}\)).*/\1/p' | head -1)
          xcodebuild test-without-building \
            -project Toasty.xcodeproj \
            -scheme Toasty \
            -destination "id=$UDID"
