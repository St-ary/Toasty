name: iOS build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test on an iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build web vault for mobile
        run: npm run build:mobile --workspace=@toasty/web

      - name: Copy web bundle into the iOS app
        run: |
          rm -rf apps/mobile/ios/App/App/public
          mkdir -p apps/mobile/ios/App/App/public
          cp -r apps/web/dist/. apps/mobile/ios/App/App/public/

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd apps/mobile/ios
          xcodegen generate

      - name: Build for testing
        run: |
          cd apps/mobile/ios
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
          echo "Using simulator: $device"
          xcodebuild build-for-testing \
            -project Toasty.xcodeproj \
            -scheme Toasty \
            -destination "platform=iOS Simulator,name=$device"

      - name: Run tests
        run: |
          cd apps/mobile/ios
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
          xcodebuild test-without-building \
            -project Toasty.xcodeproj \
            -scheme Toasty \
            -destination "platform=iOS Simulator,name=$device"
